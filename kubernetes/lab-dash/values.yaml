replicaCount: 1

namespaceOverride: "default"

image:
  repository: ghcr.io/anthonygress/lab-dash
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 2022

# Required. Signs logins and encrypts saved widget credentials.
# Generate one with `openssl rand -base64 32` and keep it between upgrades.
secret: ""

volumes:
  config:
    enabled: true
    size: 1Gi
  uploads:
    enabled: true
    size: 1Gi

resources: {}

ingress:
  enabled: true
  className: ""
  # Live widget data uses a WebSocket on /api/ws. ingress-nginx and Traefik forward it
  # without extra annotations; other controllers may need WebSocket support enabled.
  annotations: {}
  hosts:
    - host: my.domain.net
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # To enable tls
  # tls:
  #   - hosts:
  #       - labdash.local
  #     secretName: labdash-tls